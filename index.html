<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>黄金のマンゴーを探せ！</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Kaisei+Decol:wght@400;700&display=swap');

  :root {
    --gold: #C47D0E;
    --gold-light: #E8A020;
    --gold-dark: #8B5500;
    --cream: #3A2800;
    --dark: #1A0F00;
    --brown: #5C3A00;
    --bg: #FFFDF7;
    --bg2: #FFF8E7;
    --card: rgba(255, 248, 220, 0.7);
    --card-border: rgba(196, 125, 14, 0.2);
    --text: #3A2800;
    --text-sub: #7A5A20;
    --text-muted: #B8965A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 背景テクスチャ */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 30%, rgba(245,166,35,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 70%, rgba(196,125,14,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(245,200,35,0.04) 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  /* 浮遊する小さな点 */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: var(--gold-light);
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: var(--o, 0.4); transform: scale(1); }
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 100px;
  }

  /* ヘッダー */
  .header {
    text-align: center;
    padding: 32px 0 20px;
  }

  .header-title {
    font-family: 'Kaisei Decol', serif;
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--gold);
    opacity: 0.9;
    margin-bottom: 6px;
  }

  .header-main {
    font-family: 'Kaisei Decol', serif;
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #C47D0E 0%, #E8A020 50%, #8B5500 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }

  /* カード共通 */
  .card-base {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(196,125,14,0.08), 0 1px 4px rgba(196,125,14,0.06);
  }

  .card-base::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    opacity: 0.6;
  }

  /* プログレス */
  .progress-card {
    composes: card-base;
    background: linear-gradient(135deg, #FFFBF0, #FFF5D6);
    border: 1px solid rgba(196,125,14,0.25);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(196,125,14,0.08);
  }

  .progress-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    opacity: 0.6;
  }

  .progress-label {
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.25em;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .progress-mission {
    font-size: 17px;
    font-weight: 700;
    color: var(--gold-dark);
    margin-bottom: 14px;
  }

  .progress-bar-wrap {
    background: rgba(196,125,14,0.12);
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: 0%;
  }

  .progress-nums {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* みらいちずカード */
  .map-card {
    background: linear-gradient(135deg, #EBF8F0, #D4F0E4);
    border: 1px solid rgba(34,139,85,0.35);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 20px;
    animation: pulse-green 2.5s ease-in-out infinite;
    box-shadow: 0 2px 16px rgba(34,139,85,0.1);
  }

  .map-card-label {
    font-size: 11px;
    color: #1a7a4a;
    letter-spacing: 0.2em;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .map-card-img {
    width: 100%;
    max-width: 240px;
    border-radius: 12px;
    display: block;
    margin: 0 auto 12px;
    mix-blend-mode: multiply;
  }

  .map-btn {
    width: 100%;
    background: linear-gradient(135deg, #228855, #2daa70);
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
    box-shadow: 0 2px 10px rgba(34,136,85,0.25);
  }

  .map-btn:active { transform: scale(0.97); }

  @keyframes pulse-green {
    0%, 100% { box-shadow: 0 2px 16px rgba(34,139,85,0.1); }
    50% { box-shadow: 0 4px 24px rgba(34,139,85,0.22); }
  }

  /* 解答エリア */
  .answer-card {
    background: linear-gradient(135deg, #FFFBF0, #FFF5D6);
    border: 1px solid rgba(196,125,14,0.25);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 16px rgba(196,125,14,0.08);
    position: relative;
    overflow: hidden;
  }

  .answer-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    opacity: 0.6;
  }

  .answer-label {
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 12px;
    font-weight: 700;
  }

  .answer-input-wrap {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .answer-input {
    flex: 1;
    min-width: 0;
    background: rgba(255,255,255,0.85);
    border: 1.5px solid rgba(196,125,14,0.3);
    border-radius: 14px;
    padding: 14px 12px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    width: 100%;
  }

  .answer-input::placeholder { color: rgba(122,90,32,0.4); }

  .answer-input:focus {
    border-color: var(--gold-light);
    box-shadow: 0 0 0 3px rgba(196,125,14,0.1);
  }

  .answer-btn {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
    border: none;
    border-radius: 14px;
    padding: 14px 16px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 2px 10px rgba(139,85,0,0.25);
  }

  .answer-btn:active { transform: scale(0.96); }

  /* 履歴 */
  .history-section { margin-top: 8px; }

  .history-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    margin-bottom: 12px;
    text-align: center;
  }

  .history-item {
    background: linear-gradient(135deg, #FFFBF0, #FFF8E5);
    border: 1px solid rgba(196,125,14,0.2);
    border-radius: 16px;
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 0 1px 8px rgba(196,125,14,0.06);
  }

  .history-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .history-item-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .history-badge {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .history-mission-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--gold-dark);
  }

  /* 全クリ表示 */
  .completed-card {
    background: linear-gradient(135deg, #FFF8E0, #FFF0BB);
    border: 1.5px solid rgba(196,125,14,0.35);
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 24px rgba(196,125,14,0.12);
  }

  .completed-text {
    font-family: 'Kaisei Decol', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold-dark);
    margin-bottom: 4px;
  }

  .completed-sub {
    font-size: 13px;
    color: var(--text-sub);
  }

  /* モーダル */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(60,40,0,0.45);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(6px);
  }

  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: #FFFDF5;
    border: 1.5px solid rgba(196,125,14,0.3);
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(139,85,0,0.18), 0 2px 12px rgba(139,85,0,0.1);
  }

  .modal-overlay.show .modal { transform: scale(1) translateY(0); }

  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
  }

  .modal-icon {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
    animation: bounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
  }

  @keyframes bounceIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-title {
    font-family: 'Kaisei Decol', serif;
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .modal-title.wrong {
    background: linear-gradient(135deg, #cc3333, #ff6666);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .modal-comment {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-sub);
    margin-bottom: 20px;
    white-space: pre-line;
  }

  .modal-image {
    width: 100%;
    max-width: 200px;
    display: block;
    margin: 0 auto 16px;
    border-radius: 12px;
    animation: fadeIn 0.5s ease 0.3s both;
    mix-blend-mode: multiply;
  }

  .modal-image.map-img { max-width: 180px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-close {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
    border: none;
    border-radius: 14px;
    padding: 14px 32px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
    width: 100%;
    box-shadow: 0 2px 10px rgba(139,85,0,0.25);
  }

  .modal-close:active { transform: scale(0.97); }

  /* キラキラ */
  @keyframes sparkle {
    0% { transform: scale(0) rotate(0deg); opacity: 1; }
    100% { transform: scale(1) rotate(180deg); opacity: 0; }
  }

  .sparkle {
    position: absolute;
    pointer-events: none;
    animation: sparkle 0.8s ease-out forwards;
    font-size: 20px;
  }

  /* 開発用 */
  .dev-panel {
    margin-top: 40px;
    padding: 16px;
    border: 1px dashed rgba(200,80,80,0.3);
    border-radius: 12px;
    text-align: center;
    background: rgba(255,230,230,0.3);
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrapper">

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-title">✦ ANNIVERSARY QUEST ✦</div>
    <div class="header-main">黄金のマンゴーを探せ！</div>
  </div>

  <!-- プログレス -->
  <div class="progress-card">
    <div class="progress-label">CURRENT MISSION</div>
    <div class="progress-mission" id="mission-text">🔍 Mission 1 を解こう！</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-nums">
      <span id="progress-count">0 / 4 クリア</span>
      <span id="progress-pct">0%</span>
    </div>
  </div>

  <!-- みらいちずカード（4問クリア後に表示） -->
  <div class="map-card" id="map-card" style="display:none">
    <div class="map-card-label">✦ アイテムを入手した！</div>
    <img class="map-card-img" src="miraitizu.png" alt="みらいちず">
    <button class="map-btn" onclick="useMapBtn()">🗺️ みらいちずを使う！</button>
  </div>

  <!-- 全クリ表示 -->
  <div class="completed-card" id="completed-card" style="display:none">
    <img src="ougonnomango.png" alt="黄金のマンゴー" style="width:120px;height:120px;object-fit:contain;display:block;margin:0 auto 8px;mix-blend-mode:multiply;">
    <div class="completed-text">黄金のマンゴーをゲット！！</div>
    <div class="completed-sub">謎解きコンプリート！おめでとう🎉</div>
  </div>

  <!-- 解答エリア -->
  <div class="answer-card" id="answer-card">
    <div class="answer-label">🗝️ 答えを入力してね</div>
    <div class="answer-input-wrap">
      <input
        class="answer-input"
        id="answer-input"
        type="text"
        placeholder="ひらがなで入力..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
      />
      <button class="answer-btn" onclick="submitAnswer()">送る</button>
    </div>
  </div>

  <!-- 履歴 -->
  <div class="history-section" id="history-section">
    <div class="history-label">— クリア済みミッション —</div>
    <div id="history-list"></div>
  </div>

  <!-- 🛠️ 開発用ボタン（本番前に削除） -->
  <div class="dev-panel">
    <div style="font-size:11px;color:rgba(200,80,80,0.6);letter-spacing:0.15em;margin-bottom:10px;">🛠️ 開発用 / 本番前に削除</div>
    <button onclick="devReset()" style="background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);border-radius:10px;padding:10px 20px;color:rgba(180,60,60,0.9);font-family:'Zen Maru Gothic',sans-serif;font-size:13px;cursor:pointer;">
      Mission 3 までクリア状態にリセット
    </button>
  </div>

</div>

<!-- モーダル -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modal-box">
    <span class="modal-icon" id="modal-icon"></span>
    <div class="modal-title" id="modal-title"></div>
    <img class="modal-image" id="modal-image" src="" alt="" style="display:none">
    <div class="modal-comment" id="modal-comment"></div>
    <button class="modal-close" id="modal-close" onclick="closeModal()">とじる</button>
  </div>
</div>

<script>
  const QUIZZES = [
    { id: 1, name: 'Mission 1', answer: 'うみかぜ', comment: 'うみかぜを感じながら黄金のマンゴー探しの旅へ！', image: null },
    { id: 2, name: 'Mission 2', answer: 'きせき', comment: 'たーくんが仲間になったぞ！人が出会う確率はなんと約0.0004%！まさにあーちゃんと出会えたことがキセキ！！', image: null },
    { id: 3, name: 'Mission 3', answer: 'はなび', comment: '思い出といえばやっぱり花火だよね．．．ってまずい！花火に見とれて黄金のマンゴーを探すの忘れてた！！', image: null },
    { id: 4, name: 'Mission 4', answer: 'みらいちず', comment: 'みらいちずをゲット！これで黄金のマンゴーのありかがわかるはず！！', image: 'miraitizu.png' },
  ];

  function getState() {
    try {
      const s = localStorage.getItem('mango_quest_state');
      return s ? JSON.parse(s) : { cleared: [] };
    } catch { return { cleared: [] }; }
  }

  function saveState(state) {
    localStorage.setItem('mango_quest_state', JSON.stringify(state));
  }

  let state = getState();
  let modalCallback = null;

  function makeStars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 3 + 1;
      s.style.cssText = `
        width: ${size}px; height: ${size}px;
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 100}%;
        --d: ${2 + Math.random() * 4}s;
        --delay: ${-Math.random() * 5}s;
        --o: ${0.15 + Math.random() * 0.35};
      `;
      container.appendChild(s);
    }
  }

  function updateUI() {
    const cleared = state.cleared.length;
    const total = QUIZZES.length;
    const pct = Math.round((cleared / total) * 100);

    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-count').textContent = `${cleared} / ${total} クリア`;
    document.getElementById('progress-pct').textContent = pct + '%';

    const nextIdx = cleared;
    const mapCleared = state.cleared.includes(4);
    const mapUsed = state.mapUsed;

    if (nextIdx < total) {
      document.getElementById('mission-text').textContent = `🔍 Mission ${nextIdx + 1} を解こう！`;
      document.getElementById('answer-card').style.display = 'block';
      document.getElementById('completed-card').style.display = 'none';
    } else if (mapUsed) {
      document.getElementById('mission-text').textContent = `🏆 全ミッションクリア！！`;
      document.getElementById('answer-card').style.display = 'none';
      document.getElementById('completed-card').style.display = 'block';
    } else {
      document.getElementById('mission-text').textContent = `🗺️ みらいちずを使おう！`;
      document.getElementById('answer-card').style.display = 'none';
      document.getElementById('completed-card').style.display = 'none';
    }

    document.getElementById('map-card').style.display = (mapCleared && !mapUsed) ? 'block' : 'none';
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    const section = document.getElementById('history-section');
    const items = [...state.cleared];
    const showMangoHistory = state.mapUsed;

    if (items.length === 0 && !showMangoHistory) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    list.innerHTML = '';

    items.forEach(qId => {
      const q = QUIZZES.find(x => x.id === qId);
      if (!q) return;
      const item = document.createElement('div');
      item.className = 'history-item';
      item.style.cursor = 'pointer';
      item.addEventListener('click', () => reopenModal(q));
      item.innerHTML = `
        <div class="history-item-header">
          <div class="history-item-left">
            <div class="history-badge">${qId}</div>
            <div class="history-mission-name">${q.name}</div>
          </div>
          <span style="font-size:13px;color:rgba(122,90,32,0.5);">タップで見る ›</span>
        </div>
      `;
      list.appendChild(item);
    });

    if (showMangoHistory) {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.style.cursor = 'pointer';
      item.addEventListener('click', () => {
        showModal({
          icon: '🥭',
          title: '黄金のマンゴー発見！！',
          titleClass: '',
          comment: '3周年おめでとう！！\n素敵な旅になったね🧡\nこれからもずっと一緒にいようね✨',
          image: 'ougonnomango.png',
          onClose: null
        });
      });
      item.innerHTML = `
        <div class="history-item-header">
          <div class="history-item-left">
            <div class="history-badge" style="background:linear-gradient(135deg,#8B5500,#E8A020);">🥭</div>
            <div class="history-mission-name">黄金のマンゴー</div>
          </div>
          <span style="font-size:13px;color:rgba(122,90,32,0.5);">タップで見る ›</span>
        </div>
      `;
      list.appendChild(item);
    }
  }

  function reopenModal(q) {
    showModal({ icon: '🎉', title: '正解！！', titleClass: '', comment: q.comment, image: q.image, onClose: null });
  }

  function submitAnswer() {
    const input = document.getElementById('answer-input');
    const raw = input.value.trim();
    if (!raw) return;

    const normalized = raw
      .toLowerCase()
      .replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
      .replace(/\s/g, '');

    const nextIdx = state.cleared.length;
    if (nextIdx >= QUIZZES.length) return;

    const q = QUIZZES[nextIdx];
    const correctNorm = q.answer.replace(/\s/g, '');

    if (normalized === correctNorm) {
      input.value = '';
      state.cleared.push(q.id);
      saveState(state);
      showModal({ icon: '🎉', title: '正解！！', titleClass: '', comment: q.comment, image: q.image, onClose: () => { updateUI(); } });
    } else {
      showModal({ icon: '😢', title: 'ちがうよ…', titleClass: 'wrong', comment: 'もう一度よく考えてみよう！', image: null, onClose: null });
    }
  }

  function useMapBtn() {
    state.mapUsed = true;
    saveState(state);
    updateUI();
    showModal({
      icon: '🥭',
      title: '黄金のマンゴー発見！！',
      titleClass: '',
      comment: '3周年おめでとう！！\n素敵な旅になったね🧡\nこれからもずっと一緒にいようね✨',
      image: 'ougonnomango.png',
      onClose: () => { updateUI(); }
    });
  }

  function showModal({ icon, title, titleClass, comment, image, onClose }) {
    document.getElementById('modal-icon').textContent = icon;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-title').className = 'modal-title ' + (titleClass || '');
    document.getElementById('modal-comment').textContent = comment;

    const img = document.getElementById('modal-image');
    if (image) {
      img.src = image;
      img.style.display = 'block';
      img.className = 'modal-image' + (image === 'miraitizu.png' ? ' map-img' : '');
    } else {
      img.style.display = 'none';
    }

    modalCallback = onClose;
    document.getElementById('modal').classList.add('show');
    if (titleClass !== 'wrong') spawnSparkles();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
    const cb = modalCallback;
    modalCallback = null;
    if (cb) cb();
  }

  function spawnSparkles() {
    const modal = document.getElementById('modal-box');
    ['✦','★','✨','🌟','💛'].forEach((s, i) => {
      setTimeout(() => {
        const el = document.createElement('span');
        el.className = 'sparkle';
        el.textContent = s;
        el.style.left = (10 + Math.random() * 80) + '%';
        el.style.top = (10 + Math.random() * 60) + '%';
        modal.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }, i * 120);
    });
  }

  document.getElementById('answer-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAnswer();
  });

  function devReset() {
    state = { cleared: [1, 2, 3] };
    saveState(state);
    updateUI();
  }

  makeStars();
  updateUI();
</script>
</body>
</html>
