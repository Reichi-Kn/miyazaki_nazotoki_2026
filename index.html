<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>黄金のマンゴーを探せ！</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Kaisei+Decol:wght@400;700&display=swap');

  :root {
    --gold: #C47D0E;
    --gold-light: #E8A020;
    --gold-dark: #8B5500;
    --cream: #3A2800;
    --dark: #1A0F00;
    --brown: #5C3A00;
    --bg: #FFFDF7;
    --bg2: #FFF8E7;
    --card: rgba(255, 248, 220, 0.7);
    --card-border: rgba(196, 125, 14, 0.2);
    --text: #3A2800;
    --text-sub: #7A5A20;
    --text-muted: #B8965A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 背景テクスチャ */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 30%, rgba(245,166,35,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 70%, rgba(196,125,14,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(245,200,35,0.04) 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  /* 浮遊する小さな点 */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: var(--gold-light);
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: var(--o, 0.4); transform: scale(1); }
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 100px;
  }

  /* ヘッダー */
  .header {
    text-align: center;
    padding: 32px 0 20px;
  }

  .header-title {
    font-family: 'Kaisei Decol', serif;
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--gold);
    opacity: 0.9;
    margin-bottom: 6px;
  }

  .header-main {
    font-family: 'Kaisei Decol', serif;
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #C47D0E 0%, #E8A020 50%, #8B5500 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }

  /* カード共通 */
  .card-base {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(196,125,14,0.08), 0 1px 4px rgba(196,125,14,0.06);
  }

  .card-base::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    opacity: 0.6;
  }

  /* プログレス */
  .progress-card {
    composes: card-base;
    background: linear-gradient(135deg, #FFFBF0, #FFF5D6);
    border: 1px solid rgba(196,125,14,0.25);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(196,125,14,0.08);
  }

  .progress-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    opacity: 0.6;
  }

  .progress-label {
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.25em;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .progress-mission {
    font-size: 17px;
    font-weight: 700;
    color: var(--gold-dark);
    margin-bottom: 14px;
  }

  .progress-bar-wrap {
    background: rgba(196,125,14,0.12);
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: 0%;
  }

  .progress-nums {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* みらいちずカード */
  .map-card {
    background: linear-gradient(135deg, #EBF8F0, #D4F0E4);
    border: 1px solid rgba(34,139,85,0.35);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 20px;
    animation: pulse-green 2.5s ease-in-out infinite;
    box-shadow: 0 2px 16px rgba(34,139,85,0.1);
  }

  .map-card-label {
    font-size: 11px;
    color: #1a7a4a;
    letter-spacing: 0.2em;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .map-card-img {
    width: 100%;
    max-width: 240px;
    border-radius: 12px;
    display: block;
    margin: 0 auto 12px;
  }

  .map-btn {
    width: 100%;
    background: linear-gradient(135deg, #228855, #2daa70);
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
    box-shadow: 0 2px 10px rgba(34,136,85,0.25);
  }

  .map-btn:active { transform: scale(0.97); }

  @keyframes pulse-green {
    0%, 100% { box-shadow: 0 2px 16px rgba(34,139,85,0.1); }
    50% { box-shadow: 0 4px 24px rgba(34,139,85,0.22); }
  }

  /* 解答エリア */
  .answer-card {
    background: linear-gradient(135deg, #FFFBF0, #FFF5D6);
    border: 1px solid rgba(196,125,14,0.25);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 16px rgba(196,125,14,0.08);
    position: relative;
    overflow: hidden;
  }

  .answer-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    opacity: 0.6;
  }

  .answer-label {
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 12px;
    font-weight: 700;
  }

  .answer-input-wrap {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .answer-input {
    flex: 1;
    min-width: 0;
    background: rgba(255,255,255,0.85);
    border: 1.5px solid rgba(196,125,14,0.3);
    border-radius: 14px;
    padding: 14px 12px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    width: 100%;
  }

  .answer-input::placeholder { color: rgba(122,90,32,0.4); }

  .answer-input:focus {
    border-color: var(--gold-light);
    box-shadow: 0 0 0 3px rgba(196,125,14,0.1);
  }

  .answer-btn {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
    border: none;
    border-radius: 14px;
    padding: 14px 16px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 2px 10px rgba(139,85,0,0.25);
  }

  .answer-btn:active { transform: scale(0.96); }

  /* 履歴 */
  .history-section { margin-top: 8px; }

  .history-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    margin-bottom: 12px;
    text-align: center;
  }

  .history-item {
    background: linear-gradient(135deg, #FFFBF0, #FFF8E5);
    border: 1px solid rgba(196,125,14,0.2);
    border-radius: 16px;
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 0 1px 8px rgba(196,125,14,0.06);
  }

  .history-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .history-item-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .history-badge {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .history-mission-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--gold-dark);
  }

  /* 全クリ表示 */
  .mango-glow-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mango-glow-ring {
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,210,40,0.5) 0%, rgba(255,180,0,0.2) 45%, transparent 70%);
    animation: mangoGlow 2s ease-in-out infinite;
  }

  @keyframes mangoGlow {
    0%, 100% { transform: scale(0.92); opacity: 0.6; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  .mango-glow-img {
    position: relative;
    width: 130px;
    height: 130px;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 0 16px rgba(245,166,35,0.8)) drop-shadow(0 0 36px rgba(255,200,0,0.5));
    animation: mangoFloat 3s ease-in-out infinite;
    z-index: 2;
  }

  @keyframes mangoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  /* 星パーティクル */
  .mango-star {
    position: absolute;
    pointer-events: none;
    z-index: 3;
    animation: starFly var(--dur, 2.4s) ease-in-out infinite var(--delay, 0s);
    font-size: var(--size, 14px);
    opacity: 0;
  }

  @keyframes starFly {
    0%   { transform: translate(0, 0) scale(0.2) rotate(0deg);   opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 0.8; }
    100% { transform: translate(var(--tx, 40px), var(--ty, -60px)) scale(1) rotate(var(--rot, 180deg)); opacity: 0; }
  }

  /* 光の粒 */
  .mango-particle {
    position: absolute;
    pointer-events: none;
    z-index: 3;
    border-radius: 50%;
    width: var(--ps, 5px);
    height: var(--ps, 5px);
    background: radial-gradient(circle, #fff 0%, #FFD700 60%, transparent 100%);
    animation: particleFly var(--dur, 2s) ease-out infinite var(--delay, 0s);
    opacity: 0;
  }

  @keyframes particleFly {
    0%   { transform: translate(0,0) scale(1);   opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translate(var(--tx,30px), var(--ty,-50px)) scale(0); opacity: 0; }
  }

  .completed-card {
    background: linear-gradient(135deg, #FFF8E0, #FFF0BB);
    border: 1.5px solid rgba(196,125,14,0.35);
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 24px rgba(196,125,14,0.12);
  }

  .completed-text {
    font-family: 'Kaisei Decol', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold-dark);
    margin-bottom: 4px;
  }

  .completed-sub {
    font-size: 13px;
    color: var(--text-sub);
  }

  /* モーダル */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(60,40,0,0.45);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(6px);
  }

  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: #FFFDF5;
    border: 1.5px solid rgba(196,125,14,0.3);
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(139,85,0,0.18), 0 2px 12px rgba(139,85,0,0.1);
  }

  .modal-overlay.show .modal { transform: scale(1) translateY(0); }

  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
  }

  .modal-icon {
    font-size: 56px;
    font-weight: 900;
    margin-bottom: 12px;
    display: block;
    line-height: 1;
    animation: bounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    font-family: 'Kaisei Decol', serif;
  }

  .modal-icon.correct {
    color: var(--gold-light);
    text-shadow: 0 0 20px rgba(196,125,14,0.5);
  }

  .modal-icon.wrong-icon {
    color: #e03333;
    text-shadow: 0 0 20px rgba(220,50,50,0.4);
  }

  @keyframes bounceIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-title {
    font-family: 'Kaisei Decol', serif;
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .modal-title.wrong {
    background: linear-gradient(135deg, #cc3333, #ff6666);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .modal-comment {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-sub);
    margin-bottom: 20px;
    white-space: pre-line;
  }

  .modal-image {
    width: 100%;
    max-width: 200px;
    display: block;
    margin: 0 auto 16px;
    border-radius: 12px;
    animation: fadeIn 0.5s ease 0.3s both;
  }

  .modal-image.map-img { max-width: 180px; }

  .modal-image.mango-modal {
    filter: drop-shadow(0 0 14px rgba(245,166,35,0.65)) drop-shadow(0 0 32px rgba(255,200,0,0.4));
    animation: fadeIn 0.5s ease 0.3s both, mangoFloat 3s ease-in-out 0.8s infinite;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-close {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
    border: none;
    border-radius: 14px;
    padding: 14px 32px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
    width: 100%;
    box-shadow: 0 2px 10px rgba(139,85,0,0.25);
  }

  .modal-close:active { transform: scale(0.97); }

  /* キラキラ */
  @keyframes sparkle {
    0% { transform: scale(0) rotate(0deg); opacity: 1; }
    100% { transform: scale(1) rotate(180deg); opacity: 0; }
  }

  .sparkle {
    position: absolute;
    pointer-events: none;
    animation: sparkle 0.8s ease-out forwards;
    font-size: 20px;
  }

  /* 開発用 */
  .dev-panel {
    margin-top: 40px;
    padding: 16px;
    border: 1px dashed rgba(200,80,80,0.3);
    border-radius: 12px;
    text-align: center;
    background: rgba(255,230,230,0.3);
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrapper">

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-title">✦ ANNIVERSARY QUEST ✦</div>
    <div class="header-main">黄金のマンゴーを探せ！</div>
  </div>

  <!-- プログレス -->
  <div class="progress-card">
    <div class="progress-label">CURRENT MISSION</div>
    <div class="progress-mission" id="mission-text">🔍 Mission 1 を解こう！</div>
    <!-- 全クリ時のマンゴーミニ表示 -->
    <div id="mission-mango" style="display:none;margin:10px 0 4px;">
      <div class="mango-glow-wrap" id="mango-wrap-mini" style="width:100px;height:100px;margin:0 auto 6px;">
        <div class="mango-glow-ring"></div>
        <img src="ougonnomango.png" alt="黄金のマンゴー" class="mango-glow-img" id="mango-mini-img" style="width:80px;height:80px;">
      </div>
      <div style="font-size:13px;font-weight:700;color:var(--gold-dark);text-align:center;">黄金のマンゴーをゲット！！</div>
      <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-top:2px;">謎解きコンプリート！おめでとう🎉</div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-nums">
      <span id="progress-count">0 / 4 クリア</span>
      <span id="progress-pct">0%</span>
    </div>
  </div>

  <!-- 解答エリア（常に表示） -->
  <div class="answer-card" id="answer-card">
    <div class="answer-label" id="answer-label">🗝️ 答えを入力してね</div>
    <div class="answer-input-wrap">
      <input
        class="answer-input"
        id="answer-input"
        type="text"
        placeholder="ひらがなで入力..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
      />
      <button class="answer-btn" onclick="submitAnswer()">送る</button>
    </div>
  </div>

  <!-- みらいちずカード（4問クリア後に表示） -->
  <div class="map-card" id="map-card" style="display:none">
    <div class="map-card-label">✦ アイテムを入手した！</div>
    <img class="map-card-img" src="miraitizu.png" alt="みらいちず">
    <button class="map-btn" id="map-use-btn">🗺️ みらいちずを使う！</button>
  </div>

  <!-- 全クリ表示 -->
  <div class="completed-card" id="completed-card" style="display:none">
    <div class="mango-glow-wrap" id="mango-wrap">
      <div class="mango-glow-ring"></div>
      <img src="ougonnomango.png" alt="黄金のマンゴー" class="mango-glow-img" id="mango-card-img">
    </div>
    <div class="completed-text">黄金のマンゴーをゲット！！</div>
    <div class="completed-sub">謎解きコンプリート！おめでとう🎉</div>
  </div>

  <!-- 履歴 -->
  <div class="history-section" id="history-section">
    <div class="history-label">— クリア済みミッション —</div>
    <div id="history-list"></div>
  </div>

  <!-- 🛠️ 開発用ボタン（本番前に削除） -->
  <div class="dev-panel">
    <div style="font-size:11px;color:rgba(200,80,80,0.6);letter-spacing:0.15em;margin-bottom:10px;">🛠️ 開発用 / 本番前に削除</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button onclick="devReset()" style="background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);border-radius:10px;padding:10px 20px;color:rgba(180,60,60,0.9);font-family:'Zen Maru Gothic',sans-serif;font-size:13px;cursor:pointer;">Mission 3 までクリア状態にリセット</button>
      <button onclick="devResetAll()" style="background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);border-radius:10px;padding:10px 20px;color:rgba(180,60,60,0.9);font-family:'Zen Maru Gothic',sans-serif;font-size:13px;cursor:pointer;">はじめにもどる</button>
    </div>
  </div>

</div>

<!-- モーダル -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modal-box">
    <span class="modal-icon" id="modal-icon"></span>
    <div class="modal-title" id="modal-title"></div>
    <img class="modal-image" id="modal-image" src="" alt="" style="display:none">
    <div class="modal-comment" id="modal-comment"></div>
    <button class="modal-close" id="modal-close" onclick="closeModal()">とじる</button>
  </div>
</div>

<script>
  const QUIZZES = [
    { id: 1, name: 'Mission 1', answer: 'うみかぜ', comment: 'うみかぜを感じながら黄金のマンゴー探しの旅へ！', image: null },
    { id: 2, name: 'Mission 2', answer: 'きせき', comment: 'たーくんが仲間になったぞ！\n人が出会う確率はなんと約0.0004%！まさにあーちゃんと出会えたことがキセキ！', image: null },
    { id: 3, name: 'Mission 3', answer: 'はなび', comment: '思い出といえばやっぱり花火だよね．．．ってまずい！\n花火に見とれて黄金のマンゴーを探すの忘れてた！', image: null },
    { id: 4, name: 'Mission 4', answer: 'みらいちず', comment: 'みらいちずをゲット！\nこれで黄金のマンゴーのありかがわかるはず！', image: 'miraitizu.png' },
  ];

  function getState() {
    try {
      const s = localStorage.getItem('mango_quest_state');
      return s ? JSON.parse(s) : { cleared: [] };
    } catch { return { cleared: [] }; }
  }

  function saveState(state) {
    localStorage.setItem('mango_quest_state', JSON.stringify(state));
  }

  let state = getState();
  let modalCallback = null;

  function makeStars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 3 + 1;
      s.style.cssText = `
        width: ${size}px; height: ${size}px;
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 100}%;
        --d: ${2 + Math.random() * 4}s;
        --delay: ${-Math.random() * 5}s;
        --o: ${0.15 + Math.random() * 0.35};
      `;
      container.appendChild(s);
    }
  }

  function updateUI() {
    const cleared = state.cleared.length;
    const total = QUIZZES.length;
    const pct = Math.round((cleared / total) * 100);

    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-count').textContent = `${cleared} / ${total} クリア`;
    document.getElementById('progress-pct').textContent = pct + '%';

    const nextIdx = cleared;
    const mapCleared = state.cleared.includes(4);
    const mapUsed = state.mapUsed;

    const missionMango = document.getElementById('mission-mango');
    const answerLabel = document.getElementById('answer-label');
    const answerInput = document.getElementById('answer-input');

    if (nextIdx < total) {
      // ミッション進行中
      document.getElementById('mission-text').textContent = `🔍 Mission ${nextIdx + 1} を解こう！`;
      document.getElementById('mission-text').style.display = 'block';
      missionMango.style.display = 'none';
      document.getElementById('answer-card').style.display = 'block';
      answerLabel.textContent = '🗝️ 答えを入力してね';
      answerInput.placeholder = 'ひらがなで入力...';
      document.getElementById('completed-card').style.display = 'none';
    } else if (mapUsed) {
      // 全クリ！
      document.getElementById('mission-text').style.display = 'none';
      missionMango.style.display = 'block';
      document.getElementById('answer-card').style.display = 'block';
      answerLabel.textContent = '🗝️ 答えを入力してね';
      answerInput.placeholder = 'ひらがなで入力...';
      document.getElementById('completed-card').style.display = 'none';
      // ミニマンゴーのパーティクル
      setTimeout(() => spawnMiniMangoParticles(), 300);
    } else {
      // みらいちず待ち
      document.getElementById('mission-text').textContent = `🗺️ みらいちずを使おう！`;
      document.getElementById('mission-text').style.display = 'block';
      missionMango.style.display = 'none';
      document.getElementById('answer-card').style.display = 'none';
      document.getElementById('completed-card').style.display = 'none';
    }

    document.getElementById('map-card').style.display = (mapCleared && !mapUsed) ? 'block' : 'none';
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    const section = document.getElementById('history-section');
    const items = [...state.cleared];
    const showMangoHistory = state.mapUsed;

    if (items.length === 0 && !showMangoHistory) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    list.innerHTML = '';

    items.forEach(qId => {
      const q = QUIZZES.find(x => x.id === qId);
      if (!q) return;
      const item = document.createElement('div');
      item.className = 'history-item';
      item.style.cursor = 'pointer';
      item.addEventListener('click', () => reopenModal(q));
      item.innerHTML = `
        <div class="history-item-header">
          <div class="history-item-left">
            <div class="history-badge">${qId}</div>
            <div class="history-mission-name">${q.name}</div>
          </div>
          <span style="font-size:13px;color:rgba(122,90,32,0.5);">タップで見る ›</span>
        </div>
      `;
      list.appendChild(item);
    });

    if (showMangoHistory) {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.style.cursor = 'pointer';
      item.addEventListener('click', () => {
        showModal({
          icon: '🥭',
          title: '黄金のマンゴー発見！！',
          titleClass: '',
          comment: '3周年おめでとう！！\n素敵な旅になったね🧡\nこれからもずっと一緒にいようね✨',
          image: 'ougonnomango.png',
          onClose: null
        });
      });
      item.innerHTML = `
        <div class="history-item-header">
          <div class="history-item-left">
            <div class="history-badge" style="background:linear-gradient(135deg,#8B5500,#E8A020);">🥭</div>
            <div class="history-mission-name">黄金のマンゴー</div>
          </div>
          <span style="font-size:13px;color:rgba(122,90,32,0.5);">タップで見る ›</span>
        </div>
      `;
      list.appendChild(item);
    }
  }

  function reopenModal(q) {
    showModal({ icon: '○', title: '正解！！', titleClass: '', comment: q.comment, image: q.image, onClose: null });
  }

  // シークレットコード（URLが決まったら設定）
  const SECRET_CODE = null; // 例: 'mango2024'
  const SECRET_URL  = null; // 例: 'https://youtu.be/xxxxx'

  function submitAnswer() {
    const input = document.getElementById('answer-input');
    const raw = input.value.trim();
    if (!raw) return;

    const normalized = raw
      .toLowerCase()
      .replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
      .replace(/\s/g, '');

    // 全クリ後はシークレットコードモード
    if (state.mapUsed) {
      if (SECRET_CODE && normalized === SECRET_CODE) {
        input.value = '';
        showModal({
          icon: '🎬',
          title: '動画を再生！',
          titleClass: '',
          comment: 'シークレット動画が解放されました！',
          image: null,
          onClose: () => { if (SECRET_URL) window.open(SECRET_URL, '_blank'); }
        });
      } else {
        showModal({ icon: '✕', title: '不正解', titleClass: 'wrong', comment: 'もう一度確認してみて！', image: null, onClose: null });
      }
      return;
    }

    const nextIdx = state.cleared.length;
    if (nextIdx >= QUIZZES.length) return;

    const q = QUIZZES[nextIdx];
    const correctNorm = q.answer.replace(/\s/g, '');

    if (normalized === correctNorm) {
      input.value = '';
      state.cleared.push(q.id);
      saveState(state);
      showModal({ icon: '○', title: '正解！！', titleClass: '', comment: q.comment, image: q.image, onClose: () => { updateUI(); } });
    } else {
      showModal({ icon: '✕', title: '不正解', titleClass: 'wrong', comment: 'もう一度よく考えてみよう！', image: null, onClose: null });
    }
  }

  function useMapBtn() {
    state.mapUsed = true;
    saveState(state);
    updateUI();
    showModal({
      icon: '🥭',
      title: '黄金のマンゴー発見！！',
      titleClass: '',
      comment: '3周年おめでとう！！\n素敵な旅になったね🧡\nこれからもずっと一緒にいようね✨',
      image: 'ougonnomango.png',
      onClose: () => { updateUI(); }
    });
  }

  function showModal({ icon, title, titleClass, comment, image, onClose }) {
    const iconEl = document.getElementById('modal-icon');
    iconEl.textContent = icon;
    iconEl.className = 'modal-icon ' + (titleClass === 'wrong' ? 'wrong-icon' : 'correct');
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-title').className = 'modal-title ' + (titleClass || '');
    document.getElementById('modal-comment').textContent = comment;

    const img = document.getElementById('modal-image');
    if (image) {
      img.src = image;
      img.style.display = 'block';
      const isMango = image === 'ougonnomango.png';
      img.className = 'modal-image' + (image === 'miraitizu.png' ? ' map-img' : '') + (isMango ? ' mango-modal' : '');
      if (isMango) setTimeout(spawnModalMangoParticles, 350);
    } else {
      img.style.display = 'none';
    }

    modalCallback = onClose;
    document.getElementById('modal').classList.add('show');
    if (titleClass !== 'wrong') spawnSparkles();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
    const cb = modalCallback;
    modalCallback = null;
    if (cb) cb();
  }

  function spawnSparkles() {
    const modal = document.getElementById('modal-box');
    ['✦','★','✨','🌟','💛'].forEach((s, i) => {
      setTimeout(() => {
        const el = document.createElement('span');
        el.className = 'sparkle';
        el.textContent = s;
        el.style.left = (10 + Math.random() * 80) + '%';
        el.style.top = (10 + Math.random() * 60) + '%';
        modal.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }, i * 120);
    });
  }

  document.getElementById('answer-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAnswer();
  });

  function devReset() {
    state = { cleared: [1, 2, 3] };
    saveState(state);
    updateUI();
  }

  function devResetAll() {
    state = { cleared: [] };
    saveState(state);
    updateUI();
  }

  makeStars();
  updateUI();

  // みらいちずボタンのイベント登録
  document.getElementById('map-use-btn').addEventListener('click', useMapBtn);
</script>
</body>

<script>
// 黒背景を透明化してcanvasのdata URLを返す
function removeBlackBg(imgEl, threshold) {
  threshold = threshold || 60;
  return new Promise(function(resolve) {
    const canvas = document.createElement('canvas');
    const img2 = new Image();
    img2.crossOrigin = 'anonymous';
    img2.onload = function() {
      canvas.width = img2.naturalWidth;
      canvas.height = img2.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img2, 0, 0);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = data.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
        if (brightness < threshold) {
          const alpha = Math.round((brightness / threshold) * (brightness / threshold) * 255);
          d[i+3] = alpha;
        }
      }
      ctx.putImageData(data, 0, 0);
      resolve(canvas.toDataURL());
    };
    img2.onerror = function() { resolve(imgEl.src); };
    img2.src = imgEl.src + (imgEl.src.startsWith('data:') ? '' : '?t=' + Date.now());
  });
}

async function processStaticImages() {
  const mapImg = document.querySelector('.map-card-img');
  if (mapImg && !mapImg.dataset.processed) {
    mapImg.dataset.processed = '1';
    const url = await removeBlackBg(mapImg, 55);
    mapImg.src = url;
  }
  const completedImg = document.querySelector('.completed-card img');
  if (completedImg && !completedImg.dataset.processed) {
    completedImg.dataset.processed = '1';
    const url = await removeBlackBg(completedImg, 30);
    completedImg.src = url;
  }
}

async function processModalImage() {
  const img = document.getElementById('modal-image');
  if (!img || img.style.display === 'none' || !img.src || img.src.startsWith('data:')) return;
  const threshold = img.src.includes('miraitizu') ? 55 : 30;
  const url = await removeBlackBg(img, threshold);
  img.src = url;
}

// モーダルが開いたとき画像を処理
new MutationObserver(function(mutations) {
  mutations.forEach(function(m) {
    if (m.target.classList.contains('show')) {
      setTimeout(processModalImage, 60);
    }
  });
}).observe(document.getElementById('modal'), { attributes: true, attributeFilter: ['class'] });

// 少し遅らせて静的画像を処理（画像読み込み完了待ち）
window.addEventListener('load', function() {
  setTimeout(processStaticImages, 100);
  setTimeout(spawnMangoParticles, 200);
});

// モーダル内マンゴー用パーティクル（連続生成）
let _modalParticleTimer = null;
function spawnModalMangoParticles() {
  clearInterval(_modalParticleTimer);
  const modal = document.getElementById('modal-box');
  const STARS = ['✦','★','✶','✸','⋆','✺','·'];

  function burst() {
    if (!document.getElementById('modal').classList.contains('show')) {
      clearInterval(_modalParticleTimer);
      return;
    }
    // 1バーストで星3〜5個
    const count = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      const el = document.createElement('span');
      const isStar = Math.random() > 0.4;
      el.style.position = 'absolute';
      el.style.pointerEvents = 'none';
      el.style.zIndex = '10';
      el.style.fontSize = (8 + Math.random() * 14).toFixed(0) + 'px';
      el.style.color = ['#fff','#FFD700','#FFE87C','#FFEC99'][Math.floor(Math.random()*4)];
      el.textContent = isStar ? STARS[Math.floor(Math.random()*STARS.length)] : '·';
      // モーダル画像周辺からスタート（モーダル中央付近）
      const startX = 30 + Math.random() * 40; // %
      const startY = 20 + Math.random() * 40;
      el.style.left = startX + '%';
      el.style.top = startY + '%';
      const tx = (Math.random() - 0.5) * 120;
      const ty = -(30 + Math.random() * 80);
      const dur = 900 + Math.random() * 700;
      el.style.transition = `transform ${dur}ms ease-out, opacity ${dur}ms ease-out`;
      el.style.opacity = '0';
      modal.appendChild(el);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          el.style.opacity = '1';
          el.style.transform = `translate(${tx}px, ${ty}px) rotate(${Math.random()*360}deg) scale(${0.3 + Math.random()*0.7})`;
        });
      });
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 400);
      }, dur * 0.6);
    }
  }

  burst();
  _modalParticleTimer = setInterval(burst, 400);
}

// モーダルが閉じたらタイマー止める
document.getElementById('modal').addEventListener('transitionend', function(e) {
  if (!this.classList.contains('show')) clearInterval(_modalParticleTimer);
});

// ミニマンゴー（プログレスカード内）パーティクル
function spawnMiniMangoParticles() {
  const wrap = document.getElementById('mango-wrap-mini');
  if (!wrap || wrap.dataset.particled) return;
  wrap.dataset.particled = '1';
  const STARS = ['✦','★','✶','✸','⋆'];
  const CX = 50, CY = 50;
  for (let i = 0; i < 8; i++) {
    const el = document.createElement('span');
    el.className = 'mango-star';
    const angle = (i / 8) * Math.PI * 2;
    const r = 35 + Math.random() * 15;
    el.textContent = STARS[i % STARS.length];
    el.style.cssText = `
      left:${CX}px;top:${CY}px;
      --tx:${Math.round(Math.cos(angle)*r)}px;
      --ty:${Math.round(Math.sin(angle)*r)}px;
      --dur:${(1.8+Math.random()*1.2).toFixed(2)}s;
      --delay:-${(Math.random()*2).toFixed(2)}s;
      --size:${(8+Math.random()*8).toFixed(0)}px;
      --rot:${Math.round(120+Math.random()*240)}deg;
      color:${['#fff','#FFD700','#FFE87C'][i%3]};
    `;
    wrap.appendChild(el);
  }
  for (let i = 0; i < 10; i++) {
    const el = document.createElement('div');
    el.className = 'mango-particle';
    const angle = (i / 10) * Math.PI * 2;
    const r = 25 + Math.random() * 25;
    el.style.cssText = `
      left:${CX}px;top:${CY}px;
      --tx:${Math.round(Math.cos(angle)*r)}px;
      --ty:${Math.round(Math.sin(angle)*r)}px;
      --dur:${(1.5+Math.random()*1.2).toFixed(2)}s;
      --delay:-${(Math.random()*2.5).toFixed(2)}s;
      --ps:${(2+Math.random()*4).toFixed(1)}px;
    `;
    wrap.appendChild(el);
  }
}

// マンゴー周りの星・光パーティクル生成
function spawnMangoParticles() {
  const wrap = document.getElementById('mango-wrap');
  if (!wrap) return;

  const STARS = ['✦','★','✶','✸','⋆','✺'];
  const CX = 90, CY = 90; // wrap中心

  // 星12個
  for (let i = 0; i < 12; i++) {
    const el = document.createElement('span');
    el.className = 'mango-star';
    const angle = (i / 12) * Math.PI * 2;
    const r = 55 + Math.random() * 30;
    const tx = Math.round(Math.cos(angle) * r);
    const ty = Math.round(Math.sin(angle) * r);
    const dur = (1.8 + Math.random() * 1.4).toFixed(2);
    const delay = -(Math.random() * 2.4).toFixed(2);
    const size = (10 + Math.random() * 10).toFixed(0);
    const rot = Math.round(120 + Math.random() * 240);
    el.textContent = STARS[i % STARS.length];
    el.style.cssText = `
      left: ${CX}px; top: ${CY}px;
      --tx: ${tx}px; --ty: ${ty}px;
      --dur: ${dur}s; --delay: ${delay}s;
      --size: ${size}px; --rot: ${rot}deg;
      color: ${i % 3 === 0 ? '#fff' : i % 3 === 1 ? '#FFD700' : '#FFE87C'};
    `;
    wrap.appendChild(el);
  }

  // 光の粒16個
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('div');
    el.className = 'mango-particle';
    const angle = (i / 16) * Math.PI * 2 + 0.2;
    const r = 40 + Math.random() * 45;
    const tx = Math.round(Math.cos(angle) * r);
    const ty = Math.round(Math.sin(angle) * r);
    const dur = (1.5 + Math.random() * 1.5).toFixed(2);
    const delay = -(Math.random() * 2.8).toFixed(2);
    const ps = (3 + Math.random() * 5).toFixed(1);
    el.style.cssText = `
      left: ${CX}px; top: ${CY}px;
      --tx: ${tx}px; --ty: ${ty}px;
      --dur: ${dur}s; --delay: ${delay}s;
      --ps: ${ps}px;
    `;
    wrap.appendChild(el);
  }
}
</script>
